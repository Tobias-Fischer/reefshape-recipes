# Prioritize gpu build if cudatoolkit can be installed (through __cuda virtual package)
schema_version: 1

context:
  version: "4.3.0.dev0"
  build_number: 0

  cuda: disabled
  string_prefix: metal_

recipe:
  name: colmap-split
  version: ${{ version }}

source:
  git: https://github.com/Tobias-Fischer/colmap
  rev: a60cce32730513b1cfef0a32632dc171a9cb8089
  patches:
    # LGPL flavour: no CHOLMOD (its supernodal parts are GPL); the sparse Cholesky
    # in rotation averaging then uses Eigen's simplicial solver (conda-forge colmap-feedstock#113)
    - no-cholmod.patch


outputs:
  - package:
      name: colmap
      version: ${{ version }}
    build:
      number: ${{ build_number }}
      string: metal_lgpl_h${{ hash }}_${{ build_number }}
      variant:
        use_keys:
          # use cuda from the variant config, e.g. to build multiple CUDA variants
          - ${{ "cuda" if cuda == "enabled" }}
        # this will down-prioritize the cpu variant versus other variants of the package
        down_prioritize_variant: ${{ 0 if cuda == "enabled" else 1 }}
      script:
        file: build
        env:
          package_version: ${{ version }}

    requirements:
      build:
        - ${{ compiler('cxx') }}
        - ${{ compiler('c') }}
        - ${{ stdlib("c") }}
        - if: cuda == "enabled"
          then: ${{ compiler('cuda') }}
        - cmake
        - if: unix
          then: make
        - pkg-config
        - ninja
        - if: osx
          then: llvm-openmp
        - if: linux
          then: libgomp
        - if: win
          then: m2-sed
      host:
        - if: unix
          then:
            - xorg-libxext
            - xorg-libxdmcp
            - xorg-libxau
            - libxcb
            - xorg-libxfixes
            - xorg-libxrender
            - xorg-libx11
            - xorg-libice
            - xorg-libsm
        - if: linux
          then:
            - libglu
            - libgl-devel
            - libopengl-devel
        - libblas
        - libcblas
        - libboost-devel
        - eigen
        - eigen-abi-devel
        - freeimage
        - glog
        - gflags
        - glew
        - ceres-solver
        - if: cuda == "enabled"
          then: ceres-solver * [build="gpulgpl*"]
          else:
            - ceres-solver * [build="cpulgpl*"]
            # avoid pulling the CUDA build of faiss (and with it CUDA) into cpu builds
            - faiss * [build="*_cpu"]
            - libfaiss * [build="*_cpu"]
        # Build against Qt 6.11.2 until pyside6 6.11.3 is on conda-forge
        # (conda-forge/pyside2-feedstock#308); built against 6.11.3, colmap and
        # pycolmap cannot be installed next to pyside6 6.11.2.
        - qt6-main <6.11.3
        - git
        - flann
        - sqlite
        - if: unix
          then:
            - vlfeat
        - lz4-c
        - metis
        # libopenimageio (not the openimageio metapackage) so that its run_exports
        # (libopenimageio >=x.y.z,<x.(y+1)) apply; the metapackage has none, and the
        # libopenimageio pinning/migrations only see this name.
        - libopenimageio
        # OpenImageIOConfig.cmake does find_dependency(fmt) (header-only use)
        - fmt
        - poselib
        - faiss
        - libfaiss
        - if: cuda == "enabled"
          then:
            - libcurand-dev
            - cuda-cudart-dev
            - cuda-version ==${{ cuda_compiler_version }}
            - faiss-gpu
        - if: osx
          then: llvm-openmp
        - if: linux
          then: libgomp
        - if: not (osx and x86_64)
          then:
            - onnxruntime
            - onnxruntime-cpp
      run:
        - flann
        - ceres-solver * [build="*lgpl*"]
        - if: cuda == "enabled"
          then:
            - __cuda >=${{ cuda_compiler_version }}  # needed to ensure cuda packages are only installed in cuda environments and fallback to cpu builds otherwise
        - if: unix
          then:
            - xorg-libxext
            - xorg-libxdmcp
            - xorg-libxau
            - libxcb
            - xorg-libxfixes
            - xorg-libxrender
            - xorg-libx11
            - xorg-libice
            - xorg-libsm
            - vlfeat
        - if: linux
          then: libglu
      ignore_run_exports:
        by_name:
          # only fmt::fmt-header-only via OpenImageIO, nothing is linked
          - fmt
      run_exports:
        - ${{ pin_subpackage('colmap', upper_bound='x.x') }}

    tests:
      - script:
          - if: unix
            then:
              - test -f $PREFIX/bin/colmap
              - test -f $PREFIX/lib/libcolmap_exe.a
              - test -f $PREFIX/share/colmap/colmap-config.cmake
              - colmap patch_match_stereo -h
              - colmap help | grep -i "with Metal"
              - otool -L $PREFIX/bin/colmap | grep Metal.framework
              - if: cuda == "enabled"
                then: test -f $PREFIX/lib/libcolmap_util_cuda.a

    about:
      license: BSD-3-Clause
      license_file:
        - LICENSE
        - src/thirdparty/LSD/LICENSE
        - src/thirdparty/PoissonRecon/LICENSE
        - src/thirdparty/SiftGPU/LICENSE
        - src/thirdparty/VLFeat/LICENSE
      summary: COLMAP is a general-purpose Structure-from-Motion (SfM) and Multi-View Stereo (MVS) pipeline with a graphical and command-line interface.
      homepage: https://colmap.github.io/
